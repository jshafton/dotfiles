[colors.tab_bar.inactive_tab]
bg_color = "#727169"
fg_color = "#181820"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#223249"
fg_color = "#727169"
italic = true

[colors.tab_bar.new_tab]
bg_color = "#727169"
fg_color = "#181820"

[colors.tab_bar.new_tab_hover]
bg_color = "#9CABCA"
fg_color = "#181820"
italic = true
