[metadata]
name = "token-dark"

[colors]
foreground = "#e8e4dc"
background = "#262624"
cursor_fg = "#262624"
cursor_bg = "#e8e4dc"
cursor_border = "#e8e4dc"
selection_fg = "#e8e4dc"
selection_bg = "#3a3a37"
ansi = ["#1d1d1c", "#c67777", "#7da47a", "#c4a855", "#7b9ebd", "#a68bbf", "#6ba8a8", "#d4cfc6"]
brights = ["#5a5955", "#d97757", "#98bf95", "#c4956a", "#96b8d3", "#bea5d4", "#88c0c0", "#e8e4dc"]

[colors.tab_bar]
background = "#1d1d1c"

[colors.tab_bar.active_tab]
bg_color = "#a68bbf"
fg_color = "#262624"
intensity = "Bold"

[colors.tab_bar.inactive_tab]
bg_color = "#1d1d1c"
fg_color = "#5a5955"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#3a3a37"
fg_color = "#e8e4dc"
italic = true

[colors.tab_bar.new_tab]
bg_color = "#1d1d1c"
fg_color = "#5a5955"

[colors.tab_bar.new_tab_hover]
bg_color = "#3a3a37"
fg_color = "#e8e4dc"
italic = true
