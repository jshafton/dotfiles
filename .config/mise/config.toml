# Global mise configuration
# https://mise.jdx.dev/

[settings]
# Read .tool-versions files (asdf legacy format)
legacy_version_file = true
# Always install missing tools when entering a directory
auto_install = true

[tools]
# Default global tools - override per-project as needed
node = "24.13.1"
java = "temurin-21.0.11+10.0.LTS"
python = "3.14.3"
go = "1.26.2"
rust = "1.95.0"
uv = "0.11.7"
ruby = "4.0.2"
"npm:typescript-language-server" = "5.1.3"
awscli = { version = "2.34.41", symlink_bins = "true" }
bun = "1.3.13"
"github:can1357/oh-my-pi" = "14.6.6"
